  function renderMulti(l){
    return `<h2 class="task-intro">¡Hay dos animales escondidos en el escudo!</h2><p class="task-note">👆 Toca solamente los animales que ves en el escudo nacional.</p><div style="max-width:360px;margin:0 auto 20px">${PHOTO('emblema_escudo','Escudo nacional de Chile')}</div>
    <div class="multichoices">${l.options.map(([name,img])=>`<button type="button" class="multi-choice ${game.picked.includes(name)?'checked':''}" data-action="multi-pick" data-value="${name}" aria-pressed="${game.picked.includes(name)}">${PHOTO(img,name)}<span>${game.picked.includes(name)?'✅ ':''}${name}</span></button>`).join('')}</div><p class="flag-hint">Encontrados: ${game.picked.length} de 2</p>`;
  }
  function renderSort(l){
    const left=l.items.filter(([name])=>!game.placements[name]);const placedCount=l.items.length-left.length;
    return `<h2 class="task-intro">${placedCount} de ${l.items.length} elementos en su lugar</h2><p class="task-note">🖱️ Arrastra la imagen a su grupo. En celular: toca la imagen y luego el grupo.</p>
    <div class="drop-layout"><section class="drag-bank"><h3>📦 Elementos por clasificar</h3><div class="item-grid">${left.length?left.map(([name,img])=>`<button type="button" draggable="true" data-drag="${name}" data-action="select-item" data-item="${name}" class="drag-item ${game.selected===name?'selected':''}" aria-pressed="${game.selected===name}" aria-label="Seleccionar ${name}">${img?PHOTO(img,name,l.id==='personajes'?'portrait':''):'<span style="font-size:49px">🧀</span>'}<span>${name}</span></button>`).join(''):'<p class="task-note">¡Todas las imágenes están en su lugar! 🎉</p>'}</div></section>
    <section class="drop-zones" aria-label="Lugares de clasificación"><h3>🎯 Elige dónde va</h3>${l.zones.map(([id,emoji,label])=>{const items=l.items.filter(([name])=>game.placements[name]===id).map(([name])=>name);return `<button type="button" class="drop-zone" data-zone="${id}" data-action="drop-zone" data-id="${id}" aria-label="Grupo ${label}"><span class="zone-icon">${emoji}</span><span class="zone-content">${label}<small>${items.length} elemento${items.length===1?'':'s'} clasificado${items.length===1?'':'s'}</small>${items.length?`<span class="zone-chips">${items.map(name=>`<span class="zone-chip">✓ ${name}</span>`).join('')}</span>`:''}</span></button>`}).join('')}</section></div>`;
  }
  function renderQuiz(l){
    const q=l.questions[game.index];
    return `<div class="quiz-step">PREGUNTA ${game.index+1} DE ${l.questions.length}</div>${q.image?PHOTO(q.image,'Imagen del libro para la pregunta','quiz-art'):''}<h2 class="quiz-question">${q.q}</h2><div class="quiz-options">${quizOrder(q).map((answer,i)=>`<button type="button" class="option-btn ${game.solved && q.answer===answer?'right':''}" data-action="quiz-answer" data-answer="${i}" ${game.solved?'disabled':''}><span class="option-key">${String.fromCharCode(65+i)}</span>${answer}</button>`).join('')}</div>${game.solved?`<div class="action-row"><strong>✅ ¡Respuesta correcta!</strong><button class="button-primary" type="button" data-action="quiz-next">${game.index===l.questions.length-1?'¡Terminar desafío!':'Siguiente pregunta →'}</button></div>`:''}`;
  }
  const words=[['Los niños','La naturaleza','Los poetas'],['juegan','cantan','descubren'],['en Chile','en el mundo','con alegría']];
  function renderCreative(){
    return `<h2 class="task-intro">¡Inventa un título sorprendente!</h2><p class="task-note">📰 El libro explica que Nicanor Parra unía frases recortadas de diarios. ¡Aquí puedes inventar una!</p>
    <div class="creative-tiles">${words.map((group,col)=>`<div class="creative-column"><h3>Paso ${col+1}</h3>${group.map((word,i)=>`<button type="button" class="word-chip ${game.words[col]===word?'active':''}" data-action="creative-pick" data-col="${col}" data-word="${i}" aria-pressed="${game.words[col]===word}">${word}</button>`).join('')}</div>`).join('')}</div>
    <div class="created-poem" aria-live="polite">${[0,1,2].map(i=>game.words[i]||'···').join(' ')}</div><button type="button" class="button-primary" data-action="creative-finish" ${[0,1,2].every(i=>game.words[i])?'':'disabled'}>✨ ¡Guardar mi quebrantahuesos!</button>
    <p class="small-note" style="margin-top:15px">Inspirado en la actividad de Nicanor Parra del libro (p. 163). Las frases se crearon para este juego.</p>`;
  }
  function renderClimate(l){
    const s=l.scenes[game.index];
    return `<div class="quiz-step">LUGAR ${game.index+1} DE ${l.scenes.length}</div><h2 class="task-intro">¿Qué ropa usarías aquí?</h2><div class="climate-scene">${PHOTO(s.image,`Vivienda del libro: ${s.name}`)}<div><span class="weather-banner">${s.emoji} ${s.name}</span><div class="climate-choices">${s.choices.map(([emoji,label,id])=>`<button type="button" class="option-btn ${game.solved && s.answer===id?'right':''}" data-action="climate-pick" data-id="${id}" ${game.solved?'disabled':''}><span class="option-key">${emoji}</span>${label}</button>`).join('')}</div></div></div>${game.solved?`<div class="action-row"><strong>✅ ¡Te vestiste muy bien!</strong><button class="button-primary" type="button" data-action="climate-next">${game.index===l.scenes.length-1?'¡Terminar desafío!':'Otro lugar →'}</button></div>`:''}`;
  }
  function renderComplete(l,t){
    const index=topicLevels(t.id).findIndex(x=>x.id===l.id);const next=topicLevels(t.id)[index+1];
    return `<section class="game-frame completion" aria-label="Desafío completado">${Array.from({length:14},(_,i)=>`<span class="spark" aria-hidden="true" style="--x:${(i*31+10)%95}%;--t:${2+(i%4)*.3}s;--delay:${(i%5)*.12}s">${i%2===0?'⭐':'✨'}</span>`).join('')}
      <div class="huge-star" aria-hidden="true">⭐</div><span class="sticker-title">${game.newStar?'¡NUEVA ESTRELLA!':'¡DESAFÍO SUPERADO!'}</span><h2>¡Excelente trabajo!</h2><p>${game.newStar?'Ganaste una estrella dorada. ¡Tu esfuerzo vale mucho!':'Esta estrella ya está en tu colección. ¡Qué bueno volver a practicar!'}</p>
      ${isComplete(t.id)?`<div class="stat-bubble">🏆 Medalla desbloqueada: ${t.badge}</div>`:`<div class="stat-bubble">⭐ Ya tienes ${countDone(t.id)} de ${topicLevels(t.id).length} estrellas de este tema</div>`}
      <div class="completion-actions"><button type="button" class="button-secondary" data-action="open-topic" data-topic="${t.id}">← Ver mis desafíos</button>${next?`<button type="button" class="button-primary" data-action="open-level" data-level="${next.id}">Siguiente desafío →</button>`:`<button type="button" class="button-primary" data-action="album">Ver mi álbum 🏆</button>`}</div></section>`;
  }
  function renderAlbum(){
    return `<main id="contenido"><button type="button" class="back-btn" data-action="home">← Inicio</button><section class="topic-hero" style="--pale:#fff2d4"><div><span class="nav-label">TUS LOGROS</span><h1>⭐ Mi álbum de aventuras</h1><p>¡Cada estrella es un desafío aprendido! Colecciona las tres medallas.</p><div class="topic-stats"><span class="stat-bubble">${countDone()} de ${levels.length} estrellas</span><span class="stat-bubble">${topics.filter(t=>isComplete(t.id)).length} de 3 medallas</span></div></div><div class="bubble" aria-hidden="true">🏆</div></section>
      <div class="sticker-wall">${topics.map(t=>`<article class="sticker-card ${isComplete(t.id)?'':'locked'}"><div class="sticker" aria-hidden="true">${isComplete(t.id)?t.sticker:'🔒'}</div><h3>${t.badge}</h3><p>${isComplete(t.id)?'¡Medalla conseguida!':`Completa los ${topicLevels(t.id).length} desafíos de ${t.title}.`}</p><button type="button" class="level-cta" data-action="open-topic" data-topic="${t.id}">${isComplete(t.id)?'Revisar aventura':'Ir a jugar →'}</button></article>`).join('')}</div>
      ${allDone()?`<section class="final-summary"><h2>🎉 ¡Terminaste toda la unidad!</h2><p>Conociste los emblemas, tradiciones, personas destacadas de Chile y la diversidad de niños del mundo. ¡Felicitaciones!</p></section>`:''}
      <div class="action-row"><span class="small-note">Los avances se guardan solamente en este navegador.</span><button type="button" class="button-plain" data-action="reset-progress">↺ Borrar mis avances</button></div></main>`;
  }
  function render(){
    ROOT.innerHTML=`<div class="app-wrap mx-auto">${renderHeader()}${page==='home'?renderHome():page==='topic'?renderTopic():page==='game'?renderGame():renderAlbum()}<footer class="footer">Hecho para aprender con alegría. <strong>Unidad 4: El país en que vivimos</strong> · 1.º básico de Chile · Uso educativo con el PDF aportado.</footer></div>`;
  }
  function finish(){
    const first=!saved.done.includes(currentLevel);
    if(first){saved.done.push(currentLevel);save();}
    game.finished=true;game.newStar=first;game.feedback='';sfx(true);render();window.scrollTo({top:0,behavior:'smooth'});
    const t=topics.find(t=>t.id===byId(currentLevel).topic);
    speak(isComplete(t.id)?`¡Felicitaciones! Ganaste una estrella y la medalla ${t.badge}.`:'¡Muy bien! Ganaste una estrella dorada.');
  }
  function correct(msg){game.feedback=msg;game.solved=true;sfx();render();speak('¡Muy bien! '+msg);}
  function wrong(msg){game.feedback=msg;game.solved=false;render();notify(msg,'hint');speak(msg);}
  function handlePlace(zone){
    const l=byId(currentLevel);if(l.type!=='sort'||!game.selected)return notify('Primero elige una imagen.','hint');
    const item=l.items.find(i=>i[0]===game.selected);if(!item)return;
    if(item[2]!==zone)return wrong('¡Casi! Mira la imagen y prueba con otro grupo.');
    game.placements[item[0]]=zone;game.selected=null;game.feedback='¡Lo encontraste! Sigue así.';sfx();
    if(Object.keys(game.placements).length===l.items.length)return finish();
    render();
  }
  ROOT.addEventListener('click',e=>{
    const b=e.target.closest('[data-action]');if(!b)return;
    const action=b.dataset.action;const l=currentLevel?byId(currentLevel):null;
    switch(action){
      case 'home':navigate('home');break;
      case 'open-topic':navigate('topic',b.dataset.topic);break;
      case 'open-level':navigate('game',byId(b.dataset.level).topic,b.dataset.level);break;
      case 'album':navigate('album');break;
      case 'voice-toggle':saved.voice=!saved.voice;save();render();notify(saved.voice?'Lectura automática activada.':'Lectura automática desactivada.');if(saved.voice)speak('¡Hola! Vamos a aprender juntos.',true);else if(busyRead())speechSynthesis.cancel();break;
      case 'sound-toggle':saved.sound=!saved.sound;save();render();if(saved.sound)sfx();notify(saved.sound?'Sonidos activados.':'Sonidos desactivados.');break;
      case 'topic-tab':topicTab=b.dataset.tab;render();break;
      case 'read-lesson':{const it=lessons[Number(b.dataset.topic)][Number(b.dataset.lesson)];speak(it[1]+'. '+it[2],true);break;}
      case 'read-instruction':speak(l.instruction,true);break;
      case 'restart':navigate('game',l.topic,l.id);break;
      case 'choose-swatch':game.selected=b.dataset.id;game.feedback='';render();break;
      case 'flag-place':{
        const id=b.dataset.id;
        if(game.flagSlots[id])return notify('¡Este lugar ya está listo!');
        if(!game.selected)return notify('Primero selecciona un color.','hint');
        if(game.selected!==id)return wrong('¡Buen intento! Revisa los colores de la bandera y prueba de nuevo.');
        game.flagSlots[id]=true;game.selected=null;game.feedback='¡Ese color está en su lugar!';sfx();
        if(Object.keys(game.flagSlots).length===3)return finish();render();break;
      }
      case 'multi-pick':{
        const name=b.dataset.value;if(game.picked.includes(name))return;
        if(!l.correct.includes(name))return wrong('¡Casi! Observa el escudo: busca el ave grande y el ciervo.');
        game.picked.push(name);game.feedback='¡Encontraste uno de los animales!';sfx();if(game.picked.length===2)return finish();render();break;
      }
      case 'select-item':game.selected=b.dataset.item;game.feedback='';render();break;
      case 'drop-zone':handlePlace(b.dataset.id);break;
      case 'quiz-answer':{
        if(game.solved)return;const q=l.questions[game.index];const value=quizOrder(q)[Number(b.dataset.answer)];
        if(value===q.answer)correct('¡Correcto! ¡Vamos muy bien!');else wrong(q.hint);break;
      }
      case 'quiz-next':{
        if(!game.solved)return;if(game.index===l.questions.length-1)return finish();
        game.index++;game.solved=false;game.feedback='';render();speak(l.questions[game.index].q);break;
      }
      case 'climate-pick':{
        if(game.solved)return;const scene=l.scenes[game.index];
        if(b.dataset.id===scene.answer)correct('¡Elegiste la ropa adecuada!');else wrong(scene.hint);break;
      }
      case 'climate-next':{
        if(!game.solved)return;if(game.index===l.scenes.length-1)return finish();
        game.index++;game.solved=false;game.feedback='';render();speak('¿Qué ropa usarías en '+l.scenes[game.index].name+'?');break;
      }
      case 'creative-pick':game.words[Number(b.dataset.col)]=words[Number(b.dataset.col)][Number(b.dataset.word)];render();break;
      case 'creative-finish':if([0,1,2].every(i=>game.words[i]))finish();break;
      case 'reset-progress':if(window.confirm('¿Quieres borrar todas tus estrellas y medallas en este navegador?')){saved.done=[];save();render();notify('¡Puedes empezar una nueva aventura!');}break;
    }
  });
  // Soporte de arrastrar y soltar para computadores. En tablets y móviles también funciona tocar + tocar.
  ROOT.addEventListener('dragstart',e=>{const item=e.target.closest('[data-drag]');if(!item)return;game.selected=item.dataset.drag;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',item.dataset.drag);});
  ROOT.addEventListener('dragover',e=>{const zone=e.target.closest('[data-zone]');if(!zone)return;e.preventDefault();e.dataTransfer.dropEffect='move';zone.classList.add('over');});
  ROOT.addEventListener('dragleave',e=>{const zone=e.target.closest('[data-zone]');if(zone)zone.classList.remove('over');});
  ROOT.addEventListener('drop',e=>{const zone=e.target.closest('[data-zone]');if(!zone)return;e.preventDefault();const chosen=e.dataTransfer.getData('text/plain');if(chosen)game.selected=chosen;handlePlace(zone.dataset.zone);});
  window.addEventListener('pagehide',()=>{if(busyRead())speechSynthesis.cancel();});
  render();
})();
</script>

</body>
</html>
