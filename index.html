<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Aprende Jugando! - 1° Básico</title>
    
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM para la interactividad -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Fuente amigable para niños -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdfa; /* Fondo suave */
            touch-action: manipulation; /* Mejor respuesta en tablets */
        }
        
        .bounce-in {
            animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.1); opacity: 0; }
            60% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1); }
        }

        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
            100% { transform: translateX(0); }
        }

        .success-pulse {
            animation: pulseGreen 1s infinite;
        }

        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        .btn-game {
            transition: all 0.2s;
        }
        .btn-game:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Sistema de audio sintetizado (no requiere archivos externos)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const playTone = (freq, type, duration, vol=0.1) => {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.value = freq;
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            oscillator.stop(audioCtx.currentTime + duration);
        };

        const playSuccess = () => {
            playTone(523.25, 'sine', 0.1); // C5
            setTimeout(() => playTone(659.25, 'sine', 0.2), 100); // E5
            setTimeout(() => playTone(783.99, 'sine', 0.3), 200); // G5
        };

        const playError = () => {
            playTone(200, 'sawtooth', 0.3);
        };

        const playPop = () => {
            playTone(400, 'sine', 0.1);
        };

        const playCheer = () => {
            // Sonido de victoria al terminar una materia
            let freq = 400;
            for(let i=0; i<10; i++) {
                setTimeout(() => playTone(freq + (i*50), 'sine', 0.1, 0.05), i*50);
            }
        };

        // --- BASE DE DATOS DE ACTIVIDADES EXTRAIDAS DE LOS PDFs ---
        const gameData = {

                    {

                        options: ["A tu mascota 🐶", "A tus abuelos o padres 👵👴", "A tu juguete 🧸"],
                        correct: 1
                    },
                    {
                        type: "quiz",
                        question: "¿Qué actividad hacías cuando eras bebé y AHORA puedes hacer solito?",
                        options: ["Tomar en mamadera 🍼", "Llorar todo el día 😭", "Amarrarte los zapatos 👟", "Dormir en cuna 🛏️"],
                        correct: 2
                    },
                    {
                        type: "multiselect",
                        question: "Toca quiénes pueden formar parte de tu familia (selecciona varios):",

                    },
                    {

                    },
                    {

                    {

                    }
                ]
            },
            matematicas: {
                title: "Patrones y Números",
                color: "bg-blue-500",

                icon: "🔢",
                activities: [
                    {
                        type: "quiz",

                    {

                    },
                    {

                    },
                    {

                    {

            },
            lenguaje: {
                title: "Juntos Compartimos",
                color: "bg-green-500",
                shadow: "shadow-green-700",
                icon: "📚",
                activities: [
                    {
                        type: "quiz",
                        question: "Los sustantivos PROPIOS se escriben con mayúscula. ¿Cuál es un sustantivo propio?",
                        options: ["perro 🐶", "mesa 🪑", "Diego 👦", "ciudad 🏙️"],

                    },
                    {
                        type: "quiz",
                        question: "¿Qué artículo acompaña a la palabra 'Gatos'?",
                        options: ["Un gatos", "Una gatos", "Unos gatos", "Unas gatos"],
                        correct: 2
                    },
                    {
                        type: "quiz",
                        question: "Completa la palabra con la sílaba correcta: ___bolla 🧅",
                        options: ["Se", "Ce", "Ci", "Ze"],
                        correct: 1
                    },
                    {
                        type: "quiz",
                        question: "Completa la palabra con la sílaba correcta: ___so 🧀",
                        options: ["Ce", "Ke", "Que", "Qui"],
                        correct: 2
                    },
                    {
                        type: "quiz",
                        question: "En el poema de Charlie el dormilón que saca las lanitas... ¿Qué animal es Charlie?",
                        options: ["Un ratón 🐭", "Un perro 🐶", "Un gatito 🐱", "Un pajarito 🐦"],
                        correct: 2
                    },
                    {
                        type: "quiz",
                        question: "Completa la palabra con la sílaba correcta: Bos___ 🌲",
                        options: ["ce", "que", "qui", "se"],
                        correct: 1
                    },
                    {
                        type: "quiz",
                        question: "¿Qué artículo usarías para decir '___ mariposa'?",
                        options: ["La", "El", "Los", "Las"],
                        correct: 0
                    },
                    {
                        type: "multiselect",
                        question: "Toca SOLO los sustantivos PROPIOS (nombres, que van con mayúscula inicial):",
                        options: ["María 👧", "mesa 🪑", "Chile 🇨🇱", "lápiz ✏️"],
                        correct: [0, 2]
                    },
                    {
                        type: "sequence",
                        question: "Ordena la oración para que tenga sentido:",
                        items: ["1. El", "2. perro 🐶", "3. come 🍖", "4. mucho 😋"],
                        correctOrder: [0, 1, 2, 3]
                    },
                    {
                        type: "truefalse",
                        question: "La palabra 'perro' es un sustantivo propio y se escribe con mayúscula.",
                        answer: false
                    },
                    {
                        type: "match",
                        question: "Une la sílaba para formar la palabra:",
                        pairs: [
                            { left: "Bo", right: "tella 🍾" },
                            { left: "Galle", right: "ta 🍪" },
                            { left: "Pe", right: "rrito 🐶" }
                        ]
                    }
                ]
            }
        };

        const QuizActivity = ({ data, onComplete }) => {
            const [selected, setSelected] = React.useState(null);
            const [isWrong, setIsWrong] = React.useState(false);

            const handleOptionClick = (index) => {
                if (selected !== null) return; // Prevent multiple clicks

                if (index === data.correct) {
                    playSuccess();
                    setSelected(index);
                    setIsWrong(false);
                    setTimeout(onComplete, 1500);
                } else {
                    playError();
                    setSelected(index);
                    setIsWrong(true);
                    setTimeout(() => {
                        setSelected(null);
                        setIsWrong(false);
                    }, 800);
                }
            };

            return (
                <div className="flex flex-col items-center w-full max-w-2xl mx-auto bounce-in">
                    <h2 className="text-2xl md:text-3xl font-bold text-gray-800 text-center mb-8 bg-white p-4 rounded-2xl shadow-md border-4 border-yellow-300">
                        {data.question}
                    </h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 w-full">
                        {data.options.map((option, index) => {
                            let btnStyle = "bg-white text-gray-700 hover:bg-gray-50 border-4 border-gray-200";
                            let animStyle = "";
                            
                            if (selected === index) {
                                if (isWrong) {
                                    btnStyle = "bg-red-500 text-white border-red-600";
                                    animStyle = "shake";
                                } else {
                                    btnStyle = "bg-green-400 text-white border-green-500 success-pulse";
                                }
                            } else if (selected !== null && !isWrong) {
                                btnStyle = "bg-gray-100 text-gray-400 border-gray-200 opacity-50"; // Dim others
                            }

                            return (
                                <button 
                                    key={index}
                                    onClick={() => handleOptionClick(index)}
                                    className={`btn-game text-xl md:text-2xl font-bold p-6 rounded-2xl shadow-lg transition-all transform flex items-center justify-center ${btnStyle} ${animStyle}`}
                                >
                                    {option}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const MultiSelectActivity = ({ data, onComplete }) => {
            const [selectedIndexes, setSelectedIndexes] = React.useState([]);
            const [showError, setShowError] = React.useState(false);

            const toggleOption = (index) => {
                playPop();
                if (selectedIndexes.includes(index)) {
                    setSelectedIndexes(selectedIndexes.filter(i => i !== index));
                } else {
                    setSelectedIndexes([...selectedIndexes, index]);
                }
            };

            const checkAnswer = () => {
                const isCorrect = 
                    selectedIndexes.length === data.correct.length && 
                    data.correct.every(val => selectedIndexes.includes(val));

                if (isCorrect) {
                    playSuccess();
                    setTimeout(onComplete, 1500);
                } else {
                    playError();
                    setShowError(true);
                    setTimeout(() => setShowError(false), 800);
                }
            };

            return (
                <div className="flex flex-col items-center w-full max-w-2xl mx-auto bounce-in">
                    <h2 className="text-2xl md:text-3xl font-bold text-gray-800 text-center mb-4 bg-white p-4 rounded-2xl shadow-md border-4 border-yellow-300">
                        {data.question}
                    </h2>
                    <p className="text-gray-500 font-bold mb-6">(Toca todas las opciones correctas y luego pulsa Revisar)</p>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 w-full mb-8">
                        {data.options.map((option, index) => {
                            const isSelected = selectedIndexes.includes(index);
                            return (
                                <button 
                                    key={index}
                                    onClick={() => toggleOption(index)}
                                    className={`btn-game text-xl md:text-2xl font-bold p-4 rounded-2xl border-4 transition-all ${isSelected ? 'bg-blue-400 text-white border-blue-600 scale-105' : 'bg-white text-gray-700 border-gray-200'}`}
                                >
                                    {option}
                                </button>
                            );
                        })}
                    </div>
                    
                    <button 
                        onClick={checkAnswer}
                        className={`btn-game text-2xl font-bold py-4 px-12 rounded-full shadow-xl text-white ${showError ? 'bg-red-500 shake' : 'bg-green-500 hover:bg-green-600'}`}
                    >
                        {showError ? '¡Intenta de nuevo!' : '¡Revisar! ✅'}
                    </button>
                </div>
            );
        };

        const SequenceActivity = ({ data, onComplete }) => {
            const [sequence, setSequence] = React.useState([]);
            const [available, setAvailable] = React.useState(data.items.map((_, i) => i));
            const [isWrong, setIsWrong] = React.useState(false);

            const handlePick = (index) => {
                // Check if it's the correct next step
                const nextExpectedIndex = data.correctOrder[sequence.length];
                
                if (index === nextExpectedIndex) {
                    playPop();
                    const newSequence = [...sequence, index];
                    setSequence(newSequence);
                    setAvailable(available.filter(i => i !== index));
                    
                    if (newSequence.length === data.correctOrder.length) {
                        playSuccess();
                        setTimeout(onComplete, 1500);
                    }
                } else {
                    playError();
                    setIsWrong(true);
                    setTimeout(() => setIsWrong(false), 500);
                }
            };

            const reset = () => {
                playPop();
                setSequence([]);
                setAvailable(data.items.map((_, i) => i));
            };

            return (
                <div className="flex flex-col items-center w-full max-w-3xl mx-auto bounce-in">
                    <h2 className="text-2xl md:text-3xl font-bold text-gray-800 text-center mb-6 bg-white p-4 rounded-2xl shadow-md border-4 border-yellow-300">
                        {data.question}
                    </h2>
                    
                    {/* Contenedor de la secuencia armándose */}
                    <div className="w-full bg-blue-50 border-4 border-blue-200 rounded-2xl p-4 min-h-[120px] mb-6 flex flex-col gap-2">
                        {sequence.length === 0 && <p className="text-gray-400 text-center font-bold text-xl mt-4">Toca los botones de abajo en orden...</p>}
                        {sequence.map((itemIndex, i) => (
                            <div key={i} className="bg-green-400 text-white font-bold text-xl p-3 rounded-xl shadow bounce-in">
                                {data.items[itemIndex]}
                            </div>
                        ))}
                    </div>

                    {/* Botones disponibles */}
                    <div className={`grid grid-cols-1 md:grid-cols-2 gap-4 w-full ${isWrong ? 'shake' : ''}`}>
                        {available.map((itemIndex) => (
                            <button 
                                key={itemIndex}
                                onClick={() => handlePick(itemIndex)}
                                className="btn-game bg-white border-4 border-purple-300 text-gray-700 hover:bg-purple-50 text-lg md:text-xl font-bold p-4 rounded-2xl shadow-md flex items-center justify-center"
                            >
                                {data.items[itemIndex].replace(/^\d+\.\s*/, '') /* Quitar el número para que tengan que pensar */}
                            </button>
                        ))}
                    </div>
                    
                    {sequence.length > 0 && sequence.length < data.items.length && (
                        <button onClick={reset} className="mt-6 text-red-500 font-bold underline text-lg">
                            Empezar de nuevo 🔄
                        </button>
                    )}
                </div>
            );
        };


        const TrueFalseActivity = ({ data, onComplete }) => {
            const [selected, setSelected] = React.useState(null);
            const [isWrong, setIsWrong] = React.useState(false);

            const handleSelect = (val) => {
                if (selected !== null) return;
                
                if (val === data.answer) {
                    playSuccess();
                    setSelected(val);
                    setTimeout(onComplete, 1500);
                } else {
                    playError();
                    setSelected(val);
                    setIsWrong(true);
                    setTimeout(() => { setSelected(null); setIsWrong(false); }, 800);
                }
            };

            return (
                <div className="flex flex-col items-center w-full max-w-2xl mx-auto bounce-in">
                    <h2 className="text-2xl md:text-3xl font-bold text-gray-800 text-center mb-8 bg-white p-4 rounded-2xl shadow-md border-4 border-yellow-300">
                        {data.question}
                    </h2>
                    <div className="flex gap-4 md:gap-8 w-full justify-center">
                        <button 
                            onClick={() => handleSelect(true)} 
                            className={`btn-game text-2xl md:text-3xl font-bold p-6 rounded-3xl w-40 md:w-48 flex flex-col items-center justify-center transition-all ${selected===true && !isWrong ? 'bg-green-400 text-white success-pulse border-4 border-green-600 scale-110' : (selected===true && isWrong ? 'bg-red-500 text-white shake border-4 border-red-600' : 'bg-white text-green-600 border-4 border-green-200 hover:bg-green-50 shadow-lg')}`}
                        >
                            <span className="text-5xl mb-2">✅</span> Verdadero
                        </button>
                        <button 
                            onClick={() => handleSelect(false)} 
                            className={`btn-game text-2xl md:text-3xl font-bold p-6 rounded-3xl w-40 md:w-48 flex flex-col items-center justify-center transition-all ${selected===false && !isWrong ? 'bg-green-400 text-white success-pulse border-4 border-green-600 scale-110' : (selected===false && isWrong ? 'bg-red-500 text-white shake border-4 border-red-600' : 'bg-white text-red-600 border-4 border-red-200 hover:bg-red-50 shadow-lg')}`}
                        >
                            <span className="text-5xl mb-2">❌</span> Falso
                        </button>
                    </div>
                </div>
            );
        };

        const MatchActivity = ({ data, onComplete }) => {
            const [leftItems, setLeftItems] = React.useState([]);
            const [rightItems, setRightItems] = React.useState([]);
            const [selectedLeft, setSelectedLeft] = React.useState(null);
            const [selectedRight, setSelectedRight] = React.useState(null);
            const [matchedPairs, setMatchedPairs] = React.useState([]);
            const [isWrong, setIsWrong] = React.useState(false);

            React.useEffect(() => {
                const lefts = data.pairs.map((p, i) => ({ id: i, text: p.left }));
                // Desordenar la columna derecha para el desafío
                const rights = data.pairs.map((p, i) => ({ id: i, text: p.right }))
                                         .sort(() => Math.random() - 0.5);
                setLeftItems(lefts);
                setRightItems(rights);
            }, [data]);

            const handleLeftClick = (id) => {
                if (matchedPairs.includes(id)) return;
                playPop();
                setSelectedLeft(id);
                checkMatch(id, selectedRight);
            };

            const handleRightClick = (id) => {
                if (matchedPairs.includes(id)) return;
                playPop();
                setSelectedRight(id);
                checkMatch(selectedLeft, id);
            };

            const checkMatch = (leftId, rightId) => {
                if (leftId !== null && rightId !== null) {
                    if (leftId === rightId) {
                        playSuccess();
                        const newMatched = [...matchedPairs, leftId];
                        setMatchedPairs(newMatched);
                        setSelectedLeft(null);
                        setSelectedRight(null);
                        if (newMatched.length === data.pairs.length) {
                            setTimeout(onComplete, 1500);
                        }
                    } else {
                        playError();
                        setIsWrong(true);
                        setTimeout(() => {
                            setIsWrong(false);
                            setSelectedLeft(null);
                            setSelectedRight(null);
                        }, 600);
                    }
                }
            };

            return (
                <div className="flex flex-col items-center w-full max-w-3xl mx-auto bounce-in">
                    <h2 className="text-xl md:text-2xl font-bold text-gray-800 text-center mb-6 bg-white p-4 rounded-2xl shadow-md border-4 border-yellow-300">
                        {data.question} <br/><span className="text-base text-gray-500">(Toca uno de cada lado)</span>
                    </h2>
                    <div className={`flex w-full justify-between gap-4 md:gap-8 ${isWrong ? 'shake' : ''}`}>
                        {/* Columna Izquierda */}
                        <div className="flex flex-col gap-3 w-1/2">
                            {leftItems.map(item => (
                                <button 
                                    key={`l-${item.id}`} 
                                    onClick={() => handleLeftClick(item.id)}
                                    className={`btn-game p-4 md:p-6 text-xl md:text-2xl font-bold rounded-2xl border-4 transition-all shadow-md flex justify-center items-center ${matchedPairs.includes(item.id) ? 'bg-green-100 border-green-300 text-green-700 opacity-60' : selectedLeft === item.id ? 'bg-blue-400 border-blue-600 text-white scale-105' : 'bg-white border-blue-200 text-gray-700 hover:bg-blue-50'}`}
                                >
                                    {item.text}
                                </button>
                            ))}
                        </div>
                        {/* Columna Derecha */}
                        <div className="flex flex-col gap-3 w-1/2">
                            {rightItems.map(item => (
                                <button 
                                    key={`r-${item.id}`} 
                                    onClick={() => handleRightClick(item.id)}
                                    className={`btn-game p-4 md:p-6 text-xl md:text-2xl font-bold rounded-2xl border-4 transition-all shadow-md flex justify-center items-center ${matchedPairs.includes(item.id) ? 'bg-green-100 border-green-300 text-green-700 opacity-60' : selectedRight === item.id ? 'bg-pink-400 border-pink-600 text-white scale-105' : 'bg-white border-pink-200 text-gray-700 hover:bg-pink-50'}`}
                                >
                                    {item.text}
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const CountingActivity = ({ data, onComplete }) => {
            const [selected, setSelected] = React.useState(null);
            const [isWrong, setIsWrong] = React.useState(false);

            const handleOptionClick = (index) => {
                if (selected !== null) return;
                
                if (index === data.correct) {
                    playSuccess();
                    setSelected(index);
                    setTimeout(onComplete, 1500);
                } else {
                    playError();
                    setSelected(index);
                    setIsWrong(true);
                    setTimeout(() => { setSelected(null); setIsWrong(false); }, 800);
                }
            };

            const emojis = Array(data.count).fill(data.emoji);

            return (
                <div className="flex flex-col items-center w-full max-w-2xl mx-auto bounce-in">
                    <h2 className="text-2xl md:text-3xl font-bold text-gray-800 text-center mb-4 bg-white p-4 rounded-2xl shadow-md border-4 border-yellow-300">
                        {data.question}
                    </h2>
                    
                    {/* Área donde se muestran los elementos a contar */}
                    <div className="bg-white/60 p-6 rounded-3xl mb-8 flex flex-wrap justify-center gap-4 border-4 border-dashed border-gray-300 min-h-[150px] items-center w-full shadow-inner">
                        {emojis.map((em, i) => (
                            <span 
                                key={i} 
                                className="text-6xl md:text-7xl drop-shadow-md animate-bounce" 
                                style={{animationDelay: `${i * 0.1}s`, animationDuration: '2s'}}
                            >
                                {em}
                            </span>
                        ))}
                    </div>

                    <div className="flex gap-4 w-full justify-center flex-wrap">
                        {data.options.map((opt, index) => {
                            let btnStyle = "bg-white text-gray-700 border-4 border-gray-200 hover:bg-gray-50";
                            let animStyle = "";
                            
                            if (selected === index) {
                                if (isWrong) {
                                    btnStyle = "bg-red-500 text-white border-red-600";
                                    animStyle = "shake";
                                } else {
                                    btnStyle = "bg-green-400 text-white border-green-500 success-pulse";
                                }
                            }
                            
                            return (
                                <button 
                                    key={index}
                                    onClick={() => handleOptionClick(index)}
                                    className={`btn-game text-4xl font-black w-20 h-20 md:w-24 md:h-24 rounded-2xl shadow-lg transition-all transform flex items-center justify-center ${btnStyle} ${animStyle}`}
                                >
                                    {opt}
                                </button>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const SubjectScreen = ({ subjectKey, onBack }) => {
            const subject = gameData[subjectKey];
            const [currentAct, setCurrentAct] = React.useState(0);
            const [completed, setCompleted] = React.useState(false);

            const handleCompleteActivity = () => {
                if (currentAct < subject.activities.length - 1) {
                    setCurrentAct(currentAct + 1);
                } else {
                    playCheer();
                    setCompleted(true);
                }
            };

            const activity = subject.activities[currentAct];

            return (
                <div className="min-h-screen flex flex-col bg-slate-100">
                    {/* Header */}
                    <header className={`${subject.color} p-4 text-white flex justify-between items-center shadow-md relative z-10`}>
                        <button onClick={() => { playPop(); onBack(); }} className="btn-game bg-white/20 hover:bg-white/30 p-2 px-4 rounded-full font-bold flex items-center gap-2">
                            <span>⬅️</span> Volver
                        </button>
                        <h1 className="text-2xl md:text-4xl font-black text-center flex-1 drop-shadow-md">
                            {subject.icon} {subject.title}
                        </h1>
                        <div className="w-24"></div> {/* spacer */}
                    </header>

                    {/* Progress Bar */}
                    <div className="w-full bg-gray-200 h-6">
                        <div 
                            className={`h-6 ${subject.color} transition-all duration-500 flex items-center justify-end px-2`} 
                            style={{width: `${((currentAct) / subject.activities.length) * 100}%`}}
                        >
                             {currentAct > 0 && <span className="text-xs text-white font-bold">⭐</span>}
                        </div>
                    </div>

                    {/* Game Area */}
                    <main className="flex-1 p-4 flex flex-col justify-center items-center relative overflow-hidden">
                        {/* Background Decor */}
                        <div className="absolute top-10 left-10 text-6xl opacity-10">✏️</div>
                        <div className="absolute bottom-10 right-10 text-6xl opacity-10">📖</div>
                        <div className="absolute top-20 right-20 text-6xl opacity-10">🎨</div>

                        {!completed ? (
                            <div className="w-full relative z-10" key={currentAct}>
                                <div className="text-center mb-4">
                                    <span className="inline-block bg-white text-gray-500 font-black rounded-full px-4 py-1 shadow-sm border-2 border-gray-200">
                                        Desafío {currentAct + 1} de {subject.activities.length}
                                    </span>
                                </div>
                                
                                {activity.type === 'quiz' && <QuizActivity data={activity} onComplete={handleCompleteActivity} />}
                                {activity.type === 'multiselect' && <MultiSelectActivity data={activity} onComplete={handleCompleteActivity} />}
                                {activity.type === 'sequence' && <SequenceActivity data={activity} onComplete={handleCompleteActivity} />}
                                {activity.type === 'truefalse' && <TrueFalseActivity data={activity} onComplete={handleCompleteActivity} />}
                                {activity.type === 'match' && <MatchActivity data={activity} onComplete={handleCompleteActivity} />}
                                {activity.type === 'counting' && <CountingActivity data={activity} onComplete={handleCompleteActivity} />}
                            </div>
                        ) : (
                            <div className="text-center bounce-in bg-white p-10 rounded-3xl shadow-2xl border-8 border-yellow-400 relative z-10">
                                <div className="text-8xl mb-4">🏆</div>
                                <h2 className="text-4xl font-black text-gray-800 mb-4">¡Felicidades!</h2>
                                <p className="text-2xl font-bold text-gray-600 mb-8">Has terminado todas las actividades de {subject.title}. ¡Eres genial!</p>
                                <button 
                                    onClick={() => { playPop(); onBack(); }}
                                    className={`btn-game text-3xl font-black text-white px-10 py-4 rounded-full shadow-lg ${subject.color}`}
                                >
                                    Volver al Inicio 🏠
                                </button>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const App = () => {
            const [currentScreen, setCurrentScreen] = React.useState('home');

            const openSubject = (key) => {
                playPop();
                setCurrentScreen(key);
            };

            if (currentScreen !== 'home') {
                return <SubjectScreen subjectKey={currentScreen} onBack={() => setCurrentScreen('home')} />;
            }

            return (
                <div className="min-h-screen bg-sky-100 flex flex-col items-center justify-center p-4 relative overflow-hidden">
                    {/* Decoraciones de fondo */}
                    <div className="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
                        <div className="absolute top-10 left-10 text-6xl bounce-in" style={{animationDelay: '0.2s'}}>☀️</div>
                        <div className="absolute bottom-10 right-10 text-8xl opacity-50">🎈</div>
                        <div className="absolute top-1/4 right-10 text-5xl opacity-50">☁️</div>
                        <div className="absolute bottom-1/4 left-10 text-5xl opacity-50">☁️</div>
                    </div>

                    <div className="relative z-10 flex flex-col items-center max-w-4xl w-full">
                        <div className="bg-white p-6 md:p-8 rounded-[3rem] shadow-2xl border-8 border-white w-full text-center bounce-in">
                            <h1 className="text-4xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 mb-4 drop-shadow-sm">
                                ¡Aprende Jugando!
                            </h1>
                            <p className="text-xl md:text-2xl font-bold text-gray-600 mb-8">
                                1° Básico • Elige una materia para empezar:
                            </p>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8 w-full">
                                {/* Botón Historia */}
                                <button 
                                    onClick={() => openSubject('historia')}
                                    className="btn-game flex flex-col items-center justify-center bg-orange-400 hover:bg-orange-500 text-white rounded-3xl p-6 shadow-[0_8px_0_0_#c2410c] hover:shadow-[0_4px_0_0_#c2410c] hover:translate-y-1 transition-all border-4 border-orange-300"
                                >
                                    <span className="text-6xl md:text-7xl mb-4 bg-white/20 p-4 rounded-full">👨‍👩‍👧‍👦</span>
                                    <span className="text-2xl md:text-3xl font-black drop-shadow-md">Historia</span>
                                    <span className="text-lg font-bold text-orange-100 mt-2">Mi Familia</span>
                                </button>

                                {/* Botón Matemáticas */}
                                <button 
                                    onClick={() => openSubject('matematicas')}
                                    className="btn-game flex flex-col items-center justify-center bg-blue-500 hover:bg-blue-600 text-white rounded-3xl p-6 shadow-[0_8px_0_0_#1d4ed8] hover:shadow-[0_4px_0_0_#1d4ed8] hover:translate-y-1 transition-all border-4 border-blue-400"
                                >
                                    <span className="text-6xl md:text-7xl mb-4 bg-white/20 p-4 rounded-full">🔢</span>
                                    <span className="text-2xl md:text-3xl font-black drop-shadow-md">Matemáticas</span>
                                    <span className="text-lg font-bold text-blue-100 mt-2">Patrones</span>
                                </button>

                                {/* Botón Lenguaje */}
                                <button 
                                    onClick={() => openSubject('lenguaje')}
                                    className="btn-game flex flex-col items-center justify-center bg-green-500 hover:bg-green-600 text-white rounded-3xl p-6 shadow-[0_8px_0_0_#15803d] hover:shadow-[0_4px_0_0_#15803d] hover:translate-y-1 transition-all border-4 border-green-400"
                                >
                                    <span className="text-6xl md:text-7xl mb-4 bg-white/20 p-4 rounded-full">📚</span>
                                    <span className="text-2xl md:text-3xl font-black drop-shadow-md">Lenguaje</span>
                                    <span className="text-lg font-bold text-green-100 mt-2">Compartimos</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
