<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventuras del Lenguaje</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #f0f9ff; }
        .btn-bounce:hover { transform: scale(1.05); transition: transform 0.2s; }
        .badge-locked { filter: grayscale(100%); opacity: 0.5; }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header Stats -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center text-lg font-bold">
            <div class="flex items-center gap-4">
                <span id="ui-lives" class="flex items-center gap-1 text-red-300"></span>
                <span class="flex items-center gap-1 text-yellow-300">⚡ XP: <span id="ui-xp">0</span></span>
                <span class="flex items-center gap-1 text-yellow-400">🪙 <span id="ui-coins">0</span></span>
            </div>
            <button onclick="resetGame()" class="text-sm bg-blue-800 px-3 py-1 rounded-full hover:bg-red-500">Reiniciar Progreso</button>
        </div>
    </header>

    <!-- Main Container -->
    <main id="app-container" class="max-w-4xl mx-auto p-4 mt-6"></main>

    <!-- Feedback Modal -->
    <div id="feedback-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-md text-center transform transition-all scale-95" id="feedback-content">
            <h2 id="feedback-title" class="text-3xl font-black mb-4"></h2>
            <p id="feedback-message" class="text-lg mb-6 text-gray-600"></p>
            <button onclick="nextQuestion()" class="bg-blue-500 text-white font-bold py-3 px-8 rounded-full btn-bounce w-full text-xl shadow-lg">
                Continuar 🚀
            </button>
        </div>
    </div>

    <script>
        // --- 1. BASE DE DATOS DE PREGUNTAS (Extraídas 100% del PDF) ---
        const gameData = {
            t1: [
                { q: "¿Por dónde respiran las ballenas azules?", options: ["Por branquias", "Por pulmones", "Por la piel"], ans: 1, exp: "¡Las ballenas son mamíferos marinos! Aunque viven en el agua, respiran por pulmones." },
                { q: "¿Qué comen los ajolotes?", options: ["Algas y flores", "Frutas y verduras", "Pequeños peces y gusanos"], ans: 2, exp: "Los ajolotes son carnívoros. Se alimentan de pequeños peces y otros animales como gusanos." },
                { q: "¿A qué animal se parece la cola del caballito de mar?", options: ["Al canguro", "Al mono", "Al camaleón"], ans: 1, exp: "¡Tienen cola similar a la de los monos, cabeza de caballo y bolsa como los canguros!" },
                { q: "¿En qué estación del año las hojas de la planta Dionaea NO actúan como trampas?", options: ["En verano", "En invierno", "En primavera"], ans: 1, exp: "La Venus atrapamoscas usa sus trampas todo el año, ¡excepto en invierno!" }
            ],
            t2: [
                { q: "Completa la oración: A ___ara le gusta cantar con su mi___ófono.", options: ["Cl / cr", "Cr / cl", "Gl / gr"], ans: 0, exp: "La combinación correcta es Clara (Cl) y micrófono (cr)." },
                { q: "El esquimal está en el i___.", options: ["grú", "glú", "clú"], ans: 1, exp: "La palabra correcta es iglú, usando las letras 'gl'." }
            ],
            t3: [
                { q: "Si quieres expresar un gran susto y decir 'Ay, una araña', ¿qué signos usas?", options: ["Signos de interrogación (¿?)", "Signos de exclamación (¡!)"], ans: 1, exp: "¡Excelente! Los signos de exclamación (¡!) sirven para expresar sorpresa, alegría, susto o dolor." },
                { q: "¿Qué signos usarías para 'Cómo se llama esa flor'?", options: ["Signos de interrogación (¿?)", "Signos de exclamación (¡!)"], ans: 0, exp: "Como estás haciendo una pregunta, debes usar los signos de interrogación (¿?)." }
            ],
            t4: [
                { q: "En una carta, 'Santiago, 14 de marzo' corresponde a:", options: ["El Saludo", "Lugar y fecha", "La Despedida"], ans: 1, exp: "Es el lugar y la fecha desde donde se escribe la carta." },
                { q: "'Te quiero mucho, Isidora' es un ejemplo de:", options: ["Despedida y Firma", "Cuerpo de la carta", "Saludo"], ans: 0, exp: "Es la despedida afectuosa seguida del nombre (firma) de quien escribe." }
            ],
            t5: [
                { q: "En 'El Gato con Botas', ¿De qué trata principalmente la historia?", options: ["Un rey que cazaba perdices", "Un gato que ayuda a un pobre muchacho", "Un molinero muy rico"], ans: 1, exp: "Trata sobre un gato astuto que decide ayudar a Gabriel, el hijo del pobre molinero." },
                { q: "En 'Pinocho', ¿De qué se trata el relato?", options: ["Un carpintero que advirtió a su muñeco", "Un muñeco que fabricaba madera", "Un carpintero que deseaba que su muñeco tuviera vida"], ans: 2, exp: "Gepeto se sentía muy solo y pensó: 'Ojalá fuese un niño para que me hiciese compañía'." }
            ]
        };

        // --- 2. ESTADO DEL JUEGO (Persistencia con localStorage) ---
        let player = {
            lives: 5,
            xp: 0,
            coins: 0,
            completed: { t1: false, t2: false, t3: false, t4: false, t5: false }
        };

        let currentTopic = "";
        let currentQuestionIndex = 0;

        function loadState() {
            const saved = localStorage.getItem('aventurasLenguaje');
            if (saved) player = JSON.parse(saved);
            updateUI();
        }

        function saveState() {
            localStorage.setItem('aventurasLenguaje', JSON.stringify(player));
            updateUI();
        }

        function resetGame() {
            if(confirm("¿Estás seguro de reiniciar todo tu progreso y medallas?")) {
                localStorage.removeItem('aventurasLenguaje');
                player = { lives: 5, xp: 0, coins: 0, completed: { t1: false, t2: false, t3: false, t4: false, t5: false }};
                saveState();
                renderHome();
            }
        }

        function updateUI() {
            document.getElementById('ui-xp').innerText = player.xp;
            document.getElementById('ui-coins').innerText = player.coins;
            
            let hearts = "";
            for(let i = 0; i < 5; i++) {
                hearts += i < player.lives ? "❤️" : "🤍";
            }
            document.getElementById('ui-lives').innerHTML = `Vidas: ${hearts}`;
        }

        // --- 3. VISTAS E INTERFAZ ---
        const app = document.getElementById('app-container');

        function renderHome() {
            if(player.lives <= 0) player.lives = 5; // Recuperar vidas al volver al inicio
            saveState();

            const badges = [
                { id: 't1', title: "Explorador de la Naturaleza", icon: "🌱", req: player.completed.t1 },
                { id: 't2', title: "Maestro de las Letras", icon: "✍️", req: (player.completed.t2 && player.completed.t3 && player.completed.t4) },
                { id: 't5', title: "Detective de Cuentos", icon: "🕵️‍♂️", req: player.completed.t5 }
            ];

            let badgesHTML = badges.map(b => `
                <div class="flex flex-col items-center p-3 bg-white rounded-xl shadow ${b.req ? '' : 'badge-locked'}">
                    <span class="text-4xl">${b.icon}</span>
                    <span class="text-xs font-bold text-center mt-2">${b.title}</span>
                </div>
            `).join('');

            app.innerHTML = `
                <div class="text-center">
                    <h1 class="text-5xl font-black text-blue-700 mb-6 drop-shadow-md">¡Aventuras del Lenguaje!</h1>
                    <p class="text-xl mb-8 text-gray-700 font-semibold">Elige una misión para comenzar a jugar y ganar medallas.</p>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                        <button onclick="startTopic('t1')" class="btn-bounce bg-green-500 text-white p-6 rounded-3xl shadow-lg border-b-4 border-green-700 flex flex-col items-center">
                            <span class="text-4xl mb-2">🐋</span><span class="text-2xl font-bold">Textos Informativos</span>
                        </button>
                        <button onclick="startTopic('t2')" class="btn-bounce bg-purple-500 text-white p-6 rounded-3xl shadow-lg border-b-4 border-purple-700 flex flex-col items-center">
                            <span class="text-4xl mb-2">🔤</span><span class="text-2xl font-bold">Fonética (cr/cl - gr/gl)</span>
                        </button>
                        <button onclick="startTopic('t3')" class="btn-bounce bg-pink-500 text-white p-6 rounded-3xl shadow-lg border-b-4 border-pink-700 flex flex-col items-center">
                            <span class="text-4xl mb-2">¡¿?!</span><span class="text-2xl font-bold">Signos de Puntuación</span>
                        </button>
                        <button onclick="startTopic('t4')" class="btn-bounce bg-yellow-500 text-white p-6 rounded-3xl shadow-lg border-b-4 border-yellow-700 flex flex-col items-center">
                            <span class="text-4xl mb-2">✉️</span><span class="text-2xl font-bold">Partes de la Carta</span>
                        </button>
                        <button onclick="startTopic('t5')" class="btn-bounce bg-red-500 text-white p-6 rounded-3xl shadow-lg border-b-4 border-red-700 flex flex-col items-center md:col-span-2">
                            <span class="text-4xl mb-2">📖</span><span class="text-2xl font-bold">Inferir Narraciones</span>
                        </button>
                    </div>

                    <div class="bg-blue-200 p-6 rounded-3xl shadow-inner">
                        <h3 class="text-2xl font-black text-blue-800 mb-4">Tus Medallas</h3>
                        <div class="grid grid-cols-3 gap-4 justify-center">
                            ${badgesHTML}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- 4. LÓGICA DEL JUEGO ---
        function startTopic(topicId) {
            currentTopic = topicId;
            currentQuestionIndex = 0;
            renderQuestion();
        }

        function renderQuestion() {
            if (currentQuestionIndex >= gameData[currentTopic].length) {
                // Topic Completed
                player.completed[currentTopic] = true;
                player.xp += 100;
                saveState();
                app.innerHTML = `
                    <div class="text-center mt-20 pulse">
                        <span class="text-8xl">🏆</span>
                        <h2 class="text-4xl font-black text-green-600 mt-6">¡Misión Completada!</h2>
                        <p class="text-xl text-gray-700 mt-4">+100 XP Ganados</p>
                        <button onclick="renderHome()" class="mt-8 bg-blue-500 text-white font-bold py-4 px-10 rounded-full btn-bounce text-2xl shadow-lg">Volver al Menú</button>
                    </div>
                `;
                return;
            }

            const qData = gameData[currentTopic][currentQuestionIndex];
            
            let optionsHTML = qData.options.map((opt, idx) => `
                <button onclick="checkAnswer(${idx})" class="w-full text-left bg-white border-4 border-blue-200 hover:border-blue-500 hover:bg-blue-50 text-gray-700 font-bold py-4 px-6 rounded-2xl mb-4 transition-all text-xl shadow-sm btn-bounce">
                    ${opt}
                </button>
            `).join('');

            app.innerHTML = `
                <div class="bg-white p-8 rounded-3xl shadow-xl max-w-2xl mx-auto mt-10 border-t-8 border-blue-500">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-sm font-bold text-gray-400 uppercase tracking-wide">Pregunta ${currentQuestionIndex + 1} de ${gameData[currentTopic].length}</span>
                    </div>
                    <h2 class="text-3xl font-black text-gray-800 mb-8">${qData.q}</h2>
                    <div>${optionsHTML}</div>
                </div>
            `;
        }

        function checkAnswer(selectedIndex) {
            const qData = gameData[currentTopic][currentQuestionIndex];
            const modal = document.getElementById('feedback-modal');
            const title = document.getElementById('feedback-title');
            const message = document.getElementById('feedback-message');
            
            if (selectedIndex === qData.ans) {
                // Correct
                player.xp += 20;
                player.coins += 10;
                title.innerHTML = "¡Excelente! 🌟";
                title.className = "text-3xl font-black mb-4 text-green-500";
                message.innerHTML = qData.exp;
                saveState();
            } else {
                // Incorrect
                player.lives -= 1;
                title.innerHTML = "¡Casi! No te rindas 💪";
                title.className = "text-3xl font-black mb-4 text-red-500";
                message.innerHTML = `La respuesta correcta era: <strong>${qData.options[qData.ans]}</strong>.<br><br><em>${qData.exp}</em>`;
                saveState();

                if(player.lives <= 0) {
                    gameOver();
                    return;
                }
            }
            modal.classList.remove('hidden');
        }

        function nextQuestion() {
            document.getElementById('feedback-modal').classList.add('hidden');
            currentQuestionIndex++;
            renderQuestion();
        }

        function gameOver() {
            document.getElementById('feedback-modal').classList.add('hidden');
            app.innerHTML = `
                <div class="text-center mt-20">
                    <span class="text-8xl">💔</span>
                    <h2 class="text-4xl font-black text-red-600 mt-6">¡Te has quedado sin vidas!</h2>
                    <p class="text-xl text-gray-700 mt-4 mb-8">El aprendizaje toma tiempo. Descansa un momento y vuelve a intentarlo.</p>
                    <button onclick="renderHome()" class="bg-blue-500 text-white font-bold py-4 px-10 rounded-full btn-bounce text-2xl shadow-lg">Recuperar Vidas y Volver</button>
                </div>
            `;
        }

        // Initialize App
        loadState();
        renderHome();
    </script>
</body>
</html>
