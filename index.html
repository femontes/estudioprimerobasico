function discover(l){const f=l.facts[s.fact],picture=f[0],label=f[1],desc=f[2],em=f[3]||l.emoji;const last=s.fact===l.facts.length-1;return `${contentHead('🔎 ¡Descubre!','Mira cada imagen y conoce algo nuevo.',desc)}<div class="discover-layout"><div class="scene">${imageHtml(picture,em)}</div><div class="fact-box"><div><span class="fact-num">DESCUBRIMIENTO ${s.fact+1} DE ${l.facts.length}</span><h3 class="fact-label">${esc(label)}</h3><p class="fact-copy">${esc(desc)}</p></div><div class="fact-dots">${l.facts.map((_,i)=>`<span class="fact-dot ${i===s.fact?'active':''}"></span>`).join('')}</div></div></div><div class="footer-actions">${helper()}<div class="btn-line"><button class="btn btn-secondary btn-small" data-action="fact-prev" ${s.fact===0?'disabled':''}>← Anterior</button><button class="btn" data-action="fact-next">${last?'¡Ya descubrí! →':'Siguiente idea →'}</button></div></div>`;}
function initGame(config){const g={type:config.type,done:false,selected:null,matched:[],placed:{},index:0,answered:false,picks:[],open:[],busy:false};if(config.type==='memory'){g.cards=[];config.pairs.forEach((p,i)=>{g.cards.push({pair:i,value:p[0],icon:false});g.cards.push({pair:i,value:p[1],icon:true});});g.cards=shuffle(g.cards);}return g;}
function shuffle(arr){let a=arr.slice();let seed=s.level*37+s.step*101+97;for(let i=a.length-1;i>0;i--){seed=(seed*1664525+1013904223)>>>0;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function ensureGame(config){if(!s.game||s.game.type!==config.type)s.game=initGame(config);return s.game;}
function activityComponent(config){const g=ensureGame(config);if(config.type==='sort'){
 let remaining=config.items.map((x,i)=>!Object.hasOwn(g.placed,i)?`<button type="button" class="sort-token ${g.selected===i?'selected':''}" data-source="${i}" draggable="true">${x[1]} ${esc(x[0])}</button>`:'').join('');
 return `<div class="sort-tray" aria-label="Elementos para clasificar">${remaining||'<div class="finished-banner">¡Todos están en su lugar! ✨</div>'}</div><div class="sort-buckets" style="--bucket-count:${config.buckets.length}">${config.buckets.map((b,bi)=>`<button type="button" class="sort-bucket" data-bucket="${bi}"><span class="bucket-title">${esc(b)}</span><span class="bucket-content">${config.items.map((x,i)=>g.placed[i]===bi?`<span class="bucket-item">${x[1]} ${esc(x[0])} ✓</span>`:'').join('')}</span><span class="tiny" style="margin-top:auto">Toca aquí</span></button>`).join('')}</div><p class="tiny" style="text-align:center;margin-top:14px">Toca una tarjeta y luego su lugar. En computador también puedes arrastrarla.</p>`;
 }if(config.type==='sequence'){
 const ordered=shuffle(config.items.map((x,i)=>({title:x[0],emoji:x[1],id:i})));return `<div class="question-count">DE NORTE A SUR · PASO ${Math.min(g.index+1,config.items.length)} DE ${config.items.length}</div><div class="sequence-slots">${config.items.map((x,i)=>`<span class="sequence-slot ${g.index>i?'sequence-done':''}">${g.index>i?esc(x[1]+' '+x[0]):i===g.index?'¿Cuál sigue?':'···'}</span>`).join('')}</div><div class="sort-tray">${ordered.map(x=>g.index<=x.id?`<button class="sort-token" data-sequence="${x.id}">${x.emoji} ${esc(x.title)}</button>`:'').join('')}</div><p class="tiny" style="text-align:center">Toca primero la comida del norte, luego la del centro y al final la del sur.</p>`;
 }if(config.type==='match'){
 const right=shuffle(config.pairs.map((p,i)=>({...{label:p[2],icon:p[3]},id:i})));return `<div class="match-layout"><div class="match-column">${config.pairs.map((p,i)=>`<button class="answer-card ${g.matched.includes(i)?'done':g.selected===i?'selected':''}" data-left="${i}" ${g.matched.includes(i)?'disabled':''}><span class="answer-icon">${p[1]}</span><span>${esc(p[0])}</span>${g.matched.includes(i)?' ✓':''}</button>`).join('')}</div><div class="match-line">⟷</div><div class="match-column">${right.map(x=>`<button class="answer-card ${g.matched.includes(x.id)?'done':''}" data-right="${x.id}" ${g.matched.includes(x.id)?'disabled':''}><span class="answer-icon">${x.icon}</span><span>${esc(x.label)}</span>${g.matched.includes(x.id)?' ✓':''}</button>`).join('')}</div></div><p class="tiny" style="text-align:center;margin-top:17px">Primero toca una tarjeta de la izquierda y luego su pareja de la derecha.</p>`;
 }if(config.type==='memory')return `<div class="memory-grid">${g.cards.map((c,i)=>{const matched=g.matched.includes(c.pair),flipped=matched||g.open.includes(i);return `<button class="memory-card ${flipped?(matched?'matched':'flip'):''}" data-memory="${i}" data-pair="${c.pair}" ${matched||g.busy?'disabled':''} aria-label="${flipped?esc(c.value):'Descubrir tarjeta'}">${flipped?`<span class="${c.icon?'big-emoji':''}">${esc(c.value)}</span>`:'✦'}</button>`}).join('')}</div><p class="tiny" style="text-align:center;margin-top:15px">Toca dos tarjetas. Busca una palabra y su imagen.</p>`;
 if(config.type==='pick'||config.type==='truefalse'){
 const item=config.type==='pick'?config.tasks[g.index]:config.items[g.index];const choices=config.type==='pick'?item[1]:['Verdadero','Falso'];return `<div class="question-count">DESAFÍO ${Math.min(g.index+1,config.type==='pick'?config.tasks.length:config.items.length)} DE ${config.type==='pick'?config.tasks.length:config.items.length}</div><div class="question-text">${esc(item[0])}</div><div class="pick-options">${choices.map((opt,i)=>`<button class="pick-option ${g.answered&&(config.type==='pick'?i===item[2]:((i===0)===item[1]))?'correct':''}" data-choose="${i}" ${g.answered?'disabled':''}>${config.type==='truefalse'?(i===0?'✅ ':'❎ '):''}${esc(opt)}</button>`).join('')}</div>`;
 }
 return '<p>Actividad no disponible.</p>';
}
function activityScreen(l,stage){const config=stage===1?l.learn:l.play;const g=ensureGame(config);const isLearn=stage===1;const intro=isLearn?'💡 ¡Aprende jugando!':'🎮 ¡Vamos a jugar!';return `${contentHead(intro,isLearn?'Practica lo que descubriste.':'¡Pon a prueba tus conocimientos!',config.prompt)}<div class="activity-intro"><span class="bubble">${isLearn?'🧠':'🎯'}</span><p>${esc(config.prompt)}</p></div><div class="game-zone">${activityComponent(config)}</div><div class="footer-actions">${helper()}<div class="btn-line">${g.done?`<button class="btn btn-green" data-action="next-step">${isLearn?'¡A jugar! →':'¡A demostrar! →'}</button>`:''}</div></div>`;}
function quizScreen(l){const q=l.quiz[s.q];return `${contentHead('⭐ ¡Demuestra!','Son solo 3 preguntas. Puedes intentar todas las veces que quieras.',q[0])}<div class="question-count">PREGUNTA ${s.q+1} DE ${l.quiz.length} ${'●'.repeat(s.q)}${'○'.repeat(l.quiz.length-s.q)}</div><h3 class="question-text">${esc(q[0])}</h3><div class="pick-options three">${q[1].map((o,i)=>`<button class="pick-option ${s.answered&&i===q[2]?'correct':''}" data-quiz="${i}" ${s.answered?'disabled':''}><span>${esc(o)}</span>${s.answered&&i===q[2]?'⭐':''}</button>`).join('')}</div><div class="footer-actions">${helper()}<div class="btn-line">${s.answered?`<button class="btn btn-green" data-action="quiz-next">${s.q===l.quiz.length-1?'¡Terminar misión! 🏆':'Siguiente pregunta →'}</button>`:''}</div></div>`;}
function rewardScreen(l){const last=s.level===LESSONS.length-1;return `${contentHead('🏆 ¡Misión cumplida!','¡Aprendiste algo nuevo sobre nuestro mundo!', '¡Felicitaciones! Completaste la misión '+l.title)}<div class="reward-layout"><div class="reward-medal">${l.emoji}</div><div class="eyebrow">MISIÓN ${s.level+1} COMPLETADA</div><h3 class="reward-title">¡Lo lograste!</h3><div class="reward-stars" aria-label="Tres estrellas">⭐⭐⭐</div><p class="lead" style="margin:15px auto 25px;max-width:530px">Ahora sabes más sobre <strong>${esc(l.title.toLowerCase())}</strong>. ¡Lumo está feliz contigo!</p><div class="award-actions"><button class="btn btn-secondary" data-action="map" data-world="${l.world}">🗺️ Ver mi mapa</button><button class="btn btn-green" data-action="${last?'achievements':'next-level'}">${last?'🏆 Ver mi diploma':'Siguiente misión →'}</button></div></div>`;}
function levelScreen(){const l=LESSONS[s.level];return `<div class="lesson-shell">${levelHeader(l)}<section class="content-board panel">${s.step===0?discover(l):s.step===1||s.step===2?activityScreen(l,s.step):s.step===3?quizScreen(l):rewardScreen(l)}</section><div style="margin:17px 0 0;text-align:center" class="tiny">${s.step<=3?'Puedes equivocarte y volver a intentar. ¡Aquí aprendemos jugando!':'¡Tu progreso ya quedó guardado!'}</div></div>`;}
function achievementScreen(){let n=countDone();return `<div class="map-shell"><div class="map-hero"><div><div class="eyebrow">MI COLECCIÓN</div><h1>¡Mis logros! 🏆</h1><p class="quiet">Cada estrella muestra una misión que completaste.</p></div><button class="btn btn-secondary btn-small" data-action="map">🗺️ Mi mapa</button></div><div class="achievement-header"><span class="award">🌟</span><div><div class="eyebrow">TU GRAN PROGRESO</div><h2 style="font-size:34px;margin:6px 0">${stars()} estrellas de ${LESSONS.length*3}</h2><p style="margin:0;font-weight:750;color:#64718A">${n} misiones completadas de ${LESSONS.length}</p></div></div><div class="medal-grid">${WORLDS.map((w,wi)=>{const good=worldDone(wi);return `<div class="medal-card ${good?'':'locked'}"><div class="big">${good?'🏅':'🔒'}</div><div class="eyebrow" style="font-size:12px">${w.eyebrow}</div><h3>${esc(w.name)}</h3><p class="quiet">${good?'¡Medalla conseguida!':'Completa sus misiones para ganar esta medalla.'}</p></div>`}).join('')}</div>${allDone()?`<section class="certificate"><div class="big">🏆</div><div class="eyebrow">RECONOCIMIENTO DIGITAL</div><h2>¡Gran Explorador del Mundo!</h2><p>Ha completado las 12 misiones de la unidad<br>«El país en que vivimos»</p><input aria-label="Escribe tu nombre para el diploma" id="student-name" class="name-field" placeholder="Escribe tu nombre (opcional)" value="${esc(progress.name)}" maxlength="40"><p>🌟 36 estrellas · 3 mundos descubiertos 🌟</p><button class="btn btn-green print-hidden" data-action="print">🖨️ Imprimir mi diploma</button></section>`:`<section class="panel" style="text-align:center;padding:27px;margin-top:23px"><div style="font-size:55px">🗺️</div><h3 style="font-size:25px;margin:8px">Tu diploma te espera</h3><p class="quiet">Al completar las ${LESSONS.length} misiones aparecerá aquí tu reconocimiento especial.</p><button class="btn" data-action="resume">▶ Seguir explorando</button></section>`}<div style="margin-top:23px"><button class="btn btn-secondary" data-action="home">← Volver al inicio</button><button class="reseter" data-action="reset" style="margin-left:15px">↻ Reiniciar aventura</button></div></div>`;}
function render(){document.title=s.screen==='level'?`${LESSONS[s.level].title} | ExploraMundos`:'ExploraMundos | El país en que vivimos';let body=s.screen==='home'?home():s.screen==='map'?mapScreen():s.screen==='achievements'?achievementScreen():levelScreen();app.innerHTML=nav()+`<main aria-label="Plataforma educativa">${body}</main>`+footer();}
let audio=null,musicTimer=null;
function getAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!audio)audio=new C();if(audio.state==='suspended')audio.resume();return audio;}catch(e){return null;}}
function tone(freq,delay=0,duration=.17,volume=.065,type='sine'){const a=getAudio();if(!a)return;const osc=a.createOscillator(),gain=a.createGain();osc.type=type;osc.frequency.setValueAtTime(freq,a.currentTime+delay);gain.gain.setValueAtTime(.0001,a.currentTime+delay);gain.gain.exponentialRampToValueAtTime(volume,a.currentTime+delay+.03);gain.gain.exponentialRampToValueAtTime(.0001,a.currentTime+delay+duration);osc.connect(gain);gain.connect(a.destination);osc.start(a.currentTime+delay);osc.stop(a.currentTime+delay+duration+.02);}
function fx(t){if(!s.sound)return;if(t==='good'){tone(523,0,.15,.044);tone(659,.12,.17,.049);tone(784,.24,.26,.05);}else if(t==='try'){tone(392,0,.2,.032);tone(440,.16,.28,.03);}else if(t==='finish'){[523,659,784,1047].forEach((n,i)=>tone(n,i*.13,.34,.055));}else tone(570,0,.07,.023);}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}}
function startMusic(){stopMusic();let k=0;const notes=[261.63,329.63,392,329.63,293.66,392,349.23,329.63];const play=()=>{if(!s.music)return;tone(notes[k++%notes.length],0,.85,.009,'sine')};play();musicTimer=setInterval(play,1050);}
function speak(msg){try{if(!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(msg);utter.lang='es-CL';utter.rate=.87;utter.pitch=1.12;utter.volume=1;let voices=window.speechSynthesis.getVoices();const chosen=voices.find(v=>v.lang.toLowerCase()==='es-cl')||voices.find(v=>v.lang.toLowerCase().startsWith('es'));if(chosen)utter.voice=chosen;window.speechSynthesis.speak(utter);}catch(e){}}
function speakCurrent(){if(s.screen!=='level'){speak('¡Hola! Soy Lumo. ¡Vamos a descubrir juntos!');return;}const l=LESSONS[s.level];if(s.step===0){const f=l.facts[s.fact];speak(f[1]+'. '+f[2]);}else if(s.step===1||s.step===2){const a=s.step===1?l.learn:l.play;const g=ensureGame(a);let q='';if(a.type==='pick')q=a.tasks[g.index][0];if(a.type==='truefalse')q=a.items[g.index][0];speak(a.prompt+'. '+q);}else if(s.step===3){speak(l.quiz[s.q][0]+'. '+l.quiz[s.q][1].join('. '));}else speak('¡Misión cumplida! ¡Felicitaciones! Has ganado tres estrellas.');}
function feedback(msg,kind='wait'){s.feedback=msg;s.feedbackKind=kind;s.mood=kind==='good'?'yay':kind==='try'?'think':'hello';render();}
function clearConfetti(){document.querySelectorAll('.confetti').forEach(el=>el.remove());}
function startLevel(i){clearConfetti();if(i<0||i>=LESSONS.length||(!done(i)&&i>firstUnlocked()))return;s.screen='level';s.level=i;s.step=0;s.fact=0;s.game=null;s.q=0;s.answered=false;s.feedback='¡Mira y descubre! Puedes escuchar las explicaciones.';s.feedbackKind='wait';s.mood='hello';render();scrollToTop();}
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});}
function nextStep(){if(s.step<4){s.step++;s.fact=0;s.game=null;s.q=0;s.answered=false;s.feedback=s.step===1?'¡Vamos a practicar juntos!':s.step===2?'¡Ahora, una misión de juego!':s.step===3?'¡Tú sabes mucho! Responde con calma.':'¡Estrellas para ti!';s.feedbackKind='wait';s.mood=s.step===4?'yay':'hello';if(s.step===4){progress.completed[s.level]={stars:3};store();fx('finish');confetti();}else fx('tap');render();scrollToTop();}}
function prevStep(){if(s.step>0){s.step--;s.fact=0;s.game=null;s.q=0;s.answered=false;s.feedback='¡Puedes repasar todo lo que quieras!';s.feedbackKind='wait';render();scrollToTop();}}
function completeActivity(){s.game.done=true;fx('good');feedback('¡Excelente! Completaste todas las actividades.','good');}
function activityAnswer(i){let config=s.step===1?LESSONS[s.level].learn:LESSONS[s.level].play;let g=ensureGame(config);if(g.answered||g.done)return;let item=config.type==='pick'?config.tasks[g.index]:config.items[g.index];const correct=config.type==='pick'?i===item[2]:(i===0)===item[1];if(correct){g.answered=true;fx('good');feedback('¡Muy bien! Elegiste la respuesta correcta.','good');}else{fx('try');feedback('¡Prueba otra vez! Recuerda lo que vimos en Descubre.','try');}}
function nextActivityQuestion(){const config=s.step===1?LESSONS[s.level].learn:LESSONS[s.level].play;const g=s.game;if(g.index+1>=((config.type==='pick'?config.tasks:config.items).length)){completeActivity();return;}g.index++;g.answered=false;fx('tap');feedback('¡Vamos con la siguiente!','wait');}
function checkGameEnd(config){const g=s.game;let total=(config.type==='match'||config.type==='memory')?config.pairs.length:config.items.length;let matches=config.type==='sort'?Object.keys(g.placed).length:g.matched.length;if(matches>=total)completeActivity();else feedback('¡Bien! Sigue con los que faltan.','good');}
function sequencePick(i){const cfg=s.step===1?LESSONS[s.level].learn:LESSONS[s.level].play;if(i===s.game.index){s.game.index++;if(s.game.index>=cfg.items.length){completeActivity();}else{fx('good');feedback('¡Correcto! Busca la siguiente zona.','good');}}else{fx('try');feedback('¡Mira de nuevo! Sigue el orden norte, centro y sur.','try');}}
function sourcePick(i){s.game.selected=i;fx('tap');render();}
function bucketPick(bi){const cfg=s.step===1?LESSONS[s.level].learn:LESSONS[s.level].play;const g=s.game;if(g.selected===null){feedback('Primero toca una tarjeta que quieras clasificar.','wait');return;}const i=g.selected;if(cfg.items[i][2]===bi){g.placed[i]=bi;g.selected=null;fx('good');checkGameEnd(cfg);}else{fx('try');feedback('Esa tarjeta va en otro lugar. ¡Vuelve a intentarlo!','try');}}
function matchPick(side,i){const cfg=s.step===1?LESSONS[s.level].learn:LESSONS[s.level].play;const g=s.game;if(side==='left'){if(g.matched.includes(i))return;g.selected=i;fx('tap');render();return;}if(g.selected===null){feedback('Toca primero una tarjeta de la izquierda.','wait');return;}if(g.selected===i){g.matched.push(i);g.selected=null;fx('good');checkGameEnd(cfg);}else{fx('try');feedback('¡Otra pista! Lee las dos tarjetas e intenta de nuevo.','try');}}
function flipCard(i){const cfg=s.step===1?LESSONS[s.level].learn:LESSONS[s.level].play;const g=s.game;if(g.busy||g.done||g.open.includes(i)||g.matched.includes(g.cards[i].pair))return;g.open.push(i);fx('tap');render();if(g.open.length<2)return;const [a,b]=g.open;if(g.cards[a].pair===g.cards[b].pair){g.matched.push(g.cards[a].pair);g.open=[];fx('good');checkGameEnd(cfg);}else{g.busy=true;fx('try');s.feedback='Mira las tarjetas y recuerda dónde están. ¡Otra vez!';s.feedbackKind='try';render();const level=s.level,step=s.step;setTimeout(()=>{if(s.level!==level||s.step!==step||s.game!==g)return;g.open=[];g.busy=false;render();},850);}}
function quizChoose(i){if(s.answered)return;const q=LESSONS[s.level].quiz[s.q];if(i===q[2]){s.answered=true;fx('good');feedback('¡Muy bien! Encontraste la respuesta.','good');}else{fx('try');feedback('¡Inténtalo de nuevo! '+q[3],'try');}}
function quizNext(){if(!s.answered)return;if(s.q===LESSONS[s.level].quiz.length-1){nextStep();return;}s.q++;s.answered=false;s.feedback='¡Vas muy bien! Sigue con la siguiente pregunta.';s.feedbackKind='wait';fx('tap');render();}
function confetti(){const colors=['#FFC84B','#A78BFA','#40C8B0','#FF7C9E','#82C6FB'];for(let i=0;i<55;i++){let el=document.createElement('i');el.className='confetti';el.style.setProperty('--x',Math.random()*100+'vw');el.style.setProperty('--shift',(Math.random()*180-90)+'px');el.style.setProperty('--duration',(2+Math.random()*2)+'s');el.style.setProperty('--color',colors[i%colors.length]);el.style.setProperty('--spin',Math.random()*360+'deg');el.style.animationDelay=(Math.random()*.5)+'s';document.body.appendChild(el);setTimeout(()=>el.remove(),4800);}}
function handleAction(el){const act=el.dataset.action;if(act==='sound'){s.sound=!s.sound;if(!s.sound){s.music=false;stopMusic();}fx('tap');render();return;}if(act==='music'){s.music=!s.music;if(s.music)startMusic();else stopMusic();render();return;}if(act==='speak-current'){speakCurrent();return;}if(act==='speech'){speak(el.dataset.speech||'¡Hola!');return;}if(act==='home'){clearConfetti();s.screen='home';fx('tap');render();scrollToTop();return;}if(act==='map'){clearConfetti();s.screen='map';if(el.dataset.world!==undefined)s.worldFocus=Number(el.dataset.world);fx('tap');render();scrollToTop();return;}if(act==='resume'){const idx=Math.max(0,LESSONS.findIndex((_,i)=>!done(i)));startLevel(idx<0?LESSONS.length-1:idx);return;}if(act==='level'){startLevel(Number(el.dataset.level));return;}if(act==='achievements'){clearConfetti();s.screen='achievements';fx('tap');render();scrollToTop();return;}if(act==='prev-step'){prevStep();return;}if(act==='fact-next'){if(s.fact<LESSONS[s.level].facts.length-1){s.fact++;s.feedback='¡Sigue descubriendo!';s.feedbackKind='wait';fx('tap');render();}else nextStep();return;}if(act==='fact-prev'){if(s.fact>0){s.fact--;fx('tap');render();}return;}if(act==='next-step'){if(!s.game||!s.game.done)return;nextStep();return;}if(act==='quiz-next'){quizNext();return;}if(act==='next-level'){startLevel(Math.min(s.level+1,LESSONS.length-1));return;}if(act==='print'){window.print();return;}if(act==='reset'){if(window.confirm('¿Quieres reiniciar la aventura? Se borrarán las estrellas y medallas guardadas.')){progress={completed:{},name:''};store();s.screen='home';s.level=0;s.step=0;s.game=null;s.fact=0;s.q=0;fx('tap');render();scrollToTop();}return;}}
app.addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(action){handleAction(action);return;}if(s.screen!=='level'||(s.step!==1&&s.step!==2&&s.step!==3))return;const cfg=s.step===3?null:s.step===1?LESSONS[s.level].learn:LESSONS[s.level].play;if(e.target.closest('[data-left]')){matchPick('left',Number(e.target.closest('[data-left]').dataset.left));return;}if(e.target.closest('[data-right]')){matchPick('right',Number(e.target.closest('[data-right]').dataset.right));return;}if(e.target.closest('[data-sequence]')){sequencePick(Number(e.target.closest('[data-sequence]').dataset.sequence));return;}if(e.target.closest('[data-source]')){sourcePick(Number(e.target.closest('[data-source]').dataset.source));return;}if(e.target.closest('[data-bucket]')){bucketPick(Number(e.target.closest('[data-bucket]').dataset.bucket));return;}if(e.target.closest('[data-memory]')){flipCard(Number(e.target.closest('[data-memory]').dataset.memory));return;}if(e.target.closest('[data-choose]')){activityAnswer(Number(e.target.closest('[data-choose]').dataset.choose));return;}if(e.target.closest('[data-quiz]')){quizChoose(Number(e.target.closest('[data-quiz]').dataset.quiz));return;}});
app.addEventListener('dragstart',e=>{const src=e.target.closest('[data-source]');if(src){s.game.selected=Number(src.dataset.source);e.dataTransfer.setData('text/plain',String(s.game.selected));e.dataTransfer.effectAllowed='move';}});
app.addEventListener('dragover',e=>{const b=e.target.closest('[data-bucket]');if(b){e.preventDefault();b.classList.add('hover');}});
app.addEventListener('dragleave',e=>{const b=e.target.closest('[data-bucket]');if(b)b.classList.remove('hover');});
app.addEventListener('drop',e=>{const b=e.target.closest('[data-bucket]');if(b){e.preventDefault();b.classList.remove('hover');const item=e.dataTransfer.getData('text/plain');if(item!=='')s.game.selected=Number(item);bucketPick(Number(b.dataset.bucket));}});
app.addEventListener('input',e=>{if(e.target.id==='student-name'){progress.name=e.target.value.slice(0,40);store();}});
// The question-stage 'next' control appears only after an answer; it is handled here.
app.addEventListener('click',e=>{if(e.target.closest('[data-next-question]'))nextActivityQuestion();});
// Render activity navigation from the current response state, no hidden timers or penalties.
const _activity=activityScreen;
activityScreen=function(l,stage){let html=_activity(l,stage);let cfg=stage===1?l.learn:l.play;let g=s.game;if((cfg.type==='pick'||cfg.type==='truefalse')&&g.answered&&!g.done){let label=g.index===(cfg.type==='pick'?cfg.tasks:cfg.items).length-1?'¡Actividad terminada!':'Siguiente desafío →';html=html.replace('<div class="btn-line"></div></div>',`<div class="btn-line"><button class="btn btn-green" data-next-question="1">${label}</button></div></div>`);}return html;};
render();
})();

</script>
</body></html>
